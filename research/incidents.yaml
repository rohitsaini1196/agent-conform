- id: INC-018
  vendor: anthropic
  product: claude-code
  version: documented behavior, all versions
  os: any
  config: any settings file with a schema validation error, used with -p.
  expected: Loud failure.
  actual: |
    `claude --help` states verbatim: "Settings files that fail validation are
    silently ignored in this mode (no error dialog is shown)." A policy with one
    bad key can therefore be entirely absent at runtime with no signal.
  source: claude --help (2.1.219), -p/--print entry
  status: by-design
