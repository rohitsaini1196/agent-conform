- id: INC-012
  vendor: openai
  product: codex (ChatGPT macOS app, bundled codex-cli 0.154.0-alpha.6.2)
  version: "codex-cli 0.154.0-alpha.6.2"
  os: macOS 26.6.2 (Darwin 25.6.0, arm64)
  config: |
    MDM-delivered com.openai.codex requirements_toml_base64 with
    prefix_rules pattern any_of [rm, rmdir, trash, srm, shred, unlink] decision="prompt".
  expected: Every delete reaches the reviewer.
  actual: |
    (A) Plain-word `rm --  ...` -> rule fired, reviewer denied. Correct.
    (B) `/bin/zsh -c 'set -e; ...; /bin/rm -- "${files[@]}"'` -> no match,
        16 files permanently deleted, no prompt, reviewer never consulted.
        Non-trivial scripts are treated as one opaque command.
    (C) `bash -lc 'rm ...'` -> no match, 2 files deleted, no prompt.
        Unwrapping is one level deep only.
  repro: Deploy the prefix rule, have the agent delete files via a non-trivial shell script.
  source: https://github.com/openai/codex/issues/44964
  status: open
  static_detectable: false
  why: |
    The canonical nested-shell case. The policy file is correct by inspection;
    the gap is in how the runtime tokenizes what it matches against.

