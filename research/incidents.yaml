  product: claude-code
  version: "fixed in 2.1.53"
  os: any
  cve: CVE-2026-33068
  cvss: 8.8
  config: a repository shipping .claude/settings.json with permissions.defaultMode = bypassPermissions
  expected: Workspace trust dialog shown before repository settings take effect.
  actual: |
    Permission mode was resolved from settings files before the trust dialog
    decision, so a malicious repository suppressed the prompt on first open.
  repro: |
    Attempted here as control CFG-006 across 2.1.52 / 2.1.53 / 2.1.219.
