- id: INC-025
  vendor: this project
  product: agent-conform harness
  version: "n/a"
  os: macOS 25.6.0 arm64
  config: harness invoked from inside a Claude Code session
  expected: The agent under test launches normally.
  actual: |
    Claude Code builds before ~2.1.89 refuse to start when CLAUDECODE is set
    in the environment ("Claude Code cannot be launched inside another Claude
    Code session"), exit 1 with empty stdout. The harness scored those runs as
    "agent never attempted the action" -- INCONCLUSIVE -- rather than as an
    error, silently producing a fake version difference between 2.1.52/53 and
    current. Fixed by stripping CLAUDECODE, CLAUDE_CODE_ENTRYPOINT and
    CLAUDE_CODE_SSE_PORT from the child environment.
  source: this repository
  status: fixed
  static_detectable: false
  why: |
    Class C. A second instance of the harness confidently reporting its own
    defect as agent behavior, and the one that would have been hardest to
    catch because it produced a plausible version-boundary story.
