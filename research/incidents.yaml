# Real-world cases where configured coding-agent policy != actual runtime behavior.
# Collected 2026-09-20. Every entry links to a primary source.
# status: open | fixed | closed-unclear | wontfix
# static_detectable: could a config-file scanner alone have told you this was broken?

- id: INC-001
  vendor: anthropic
  product: claude-code
  version: "2.1.71"
  os: macOS 26 (Darwin 25.3.0, arm64)
  config: |
    Console-managed org policy synced to ~/.claude/remote-settings.json with
    permissions.deny for Bash(aws *|kubectl *|terraform *|...),
    disableBypassPermissionsMode=disable, sandbox.filesystem.denyRead ["~/.aws"].
    User's own ~/.claude/settings.json contains permissions.allow ["Bash(*)"].
  expected: Managed deny rules block the commands; local allow cannot override org policy.
  actual: |
    terraform/kubectl/helm/eksctl/aws all executed. ~/.aws/config fully readable.
    The sandbox block configured in Console was never synced into remote-settings.json
    at all — only the permissions block arrived.
  repro: Configure managed policy in Console, auth as an org user, run `terraform version`.
  source: https://github.com/anthropics/claude-code/issues/31925
  status: open
  static_detectable: false
  why: |
    The local file on disk looks correct. The failure is in precedence resolution
    between two files and in a server-side sync that silently dropped a section.

- id: INC-002
  vendor: anthropic
  product: claude-code
  version: "2.1.220, 2.1.229"
  os: macOS (Darwin 25.5.0, arm64)
  config: |
    /Library/Application Support/ClaudeCode/managed-settings.json, root:wheel 644:
    permissions.disableBypassPermissionsMode = "disable",
    permissions.deny = ["Bash(touch /tmp/managed-canary*)"].
  expected: CLI refuses to start with --dangerously-skip-permissions.
  actual: |
    Session launches, runs un-preapproved writes with no prompt. The deny rule in
    the SAME FILE fires correctly inside the same bypass session, proving the file
    is loaded and parsed — only the bypass-block key has no effect.
  repro: |
    claude --dangerously-skip-permissions -p "run: echo X > /tmp/bypass-proof.txt"
  source: https://github.com/anthropics/claude-code/issues/86253
  status: closed-unclear
  static_detectable: false
  why: |
    The single best example for this whole project: the config is loaded, valid,
    and provably enforcing on one key while silently inert on another. No amount
    of file inspection distinguishes the two.

